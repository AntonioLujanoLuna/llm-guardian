[project]
name = "llm-guardian"
version = "0.1.0"
description = "Adaptive LLM Guardian with risk memory: incremental pre-inference inspection, hard policy at action boundaries, reviewed precedents."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
]

[project.optional-dependencies]
es = ["elasticsearch>=8.14,<9"]
ml = ["onnxruntime>=1.18", "transformers>=4.44"]
proxy = ["httpx>=0.27"]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
llm-guardian = "llm_guardian.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_guardian"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/llm_guardian"]
plugins = ["pydantic.mypy"]
warn_unreachable = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["llm_guardian"]

[tool.coverage.report]
show_missing = true
# A published safeguard with no test is a claim, not a control.
fail_under = 85
